name: message_hub
description: "Personal Gmail, WhatsApp and SMS statistics and cleanup."
publish_to: 'none'
version: 0.1.5+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: ^19.0.0
  sqflite: ^2.4.2
  fl_chart: ^1.1.0
  file_picker: ^13.0.0
  archive: ^4.0.7
  permission_handler: ^13.0.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  path: ^1.9.1
  intl: any
  provider: ^6.1.5
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
